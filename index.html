<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="profile-container" id="profileCard">
    <h1>Student Profile</h1>
    <h2 id="studentName">Jerume Bandol Atazar</h2>
    <p>BS Computer Science - 3rd Year</p>

    <div class="buttons">
      <button id="changeName">Change Name</button>
      <button id="changeBg">Change Background</button>
      <button id="toggleDetails">Show/Hide Details</button>
    </div>

    <p id="details" class="hidden">
      Jerume is a third-year BS Computer Science student who enjoys programming and web development.
    </p>
  </div>

  <script src="prac.js"></script>
</body>
</html>
